services:
  learn-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learn-core
    environment:
      - NODE_ENV=production
      - LEARN_CODE_DB_PATH=/app/db/learn_code.db
      - HOST=0.0.0.0
      - PORT=3100
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./db:/app/db
      - ./migrations:/app/migrations:ro
    command: ["npm", "start"]
